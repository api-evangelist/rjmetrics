name: RJMetrics
description: 'RJMetrics was a Philadelphia-based business intelligence and analytics
  company (founded 2008, backed by Trinity Ventures, SoftTech VC and others) that helped
  online businesses centralize, model and visualize data from databases and SaaS tools.
  In 2016 the company was acquired by Magento; its analytics product became Magento
  Business Intelligence and now lives inside Adobe Commerce, while the data-pipeline
  team spun out the standalone product Stitch (later acquired by Talend). The RJMetrics
  brand no longer operates independently: rjmetrics.com issues a 301 redirect to the
  Adobe/Magento Business Intelligence product page, and there is no surviving RJMetrics
  developer portal, public API, SDK or documentation surface to enrich. This profile
  is retained as a historical portfolio-company record rather than an active API provider.'
